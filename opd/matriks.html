<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papan Matriks - KOPD Mabar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/matriks.css">
    <style>
        /* Penyesuaian Layout Sidebar Dinamis (Hamburger) */
        .layout-wrapper {
            display: flex;
            width: 100%;
            min-height: 100vh;
            transition: all 0.3s ease;
        }

        .main-content {
            flex: 1;
            padding: 40px 40px 40px 80px;
            transition: all 0.3s ease;
            background: var(--sage-bg);
        }

        body.sidebar-collapsed .main-content {
            padding-left: 60px;
        }

        .header-matriks {
            margin-bottom: 24px;
        }

        .header-matriks h1 {
            color: var(--primary-green);
            margin-bottom: 8px;
            font-size: 1.8rem;
        }

        .header-matriks p {
            color: #4b5563;
            font-size: 0.95rem;
        }
    </style>
</head>

<body>

    <div class="layout-wrapper">
        <div id="sidebar-container"></div>

        <main class="main-content">
            <div class="header-matriks">
                <h1>Papan Pantau Variabel</h1>
                <p>Pilih variabel di bawah ini untuk mengisi tingkat kematangan dan mengunggah data dukung.</p>
            </div>

            <div id="matriks-container" class="matriks-grid">
            </div>
        </main>
    </div>

    <script type="module">
        import '../assets/js/state-manager.js';
        import '../assets/components/sidebar.js';
        import { dbVariabel } from '../assets/js/data-variabel.js';
        
        // 1. Cek Sesi (Wajib Login OPD)
        if (!window.checkSession('opd', '../')) throw new Error("Unauthenticated");

        // 2. Render Sidebar
        await window.renderSidebar('../', 'opd');

        // Set Title Dinamis
        const tahunAktif = await window.getTahunAktif();
        document.title = `Papan Matriks - KOPD Mabar ${tahunAktif}`;

        const container = document.getElementById('matriks-container');

        // 3. Ambil data spesifik akun OPD yang sedang login
        const opdData = await window.getCurrentOpdData();
        if (!opdData) {
            alert("Data OPD tidak ditemukan atau akun telah dihapus.");
            window.logoutUser();
            window.location.replace('../login.html');
            throw new Error("No OPD data");
        }

        // Self-healing jika variabelStatus hilang dari database (corrupted data)
        if (!opdData.variabelStatus) {
            opdData.variabelStatus = window.generateInitialVariabel();
            await window.fbUpdateDoc(window.fbDoc(window.db, "opds", opdData.docId), { variabelStatus: opdData.variabelStatus });
        }

        // Konfigurasi Label, Ikon, dan Warna untuk 5 Status
        const statusConfig = {
            0: { class: 'proses', label: '<i class="fa-solid fa-hourglass-start"></i> Belum Diisi', btnText: 'Buka Ruang Kerja', btnIcon: 'fa-pen-to-square' },
            1: { class: 'menunggu', label: '<i class="fa-solid fa-clock-rotate-left"></i> Menunggu Verifikasi', btnText: 'Lihat Isian', btnIcon: 'fa-eye' },
            2: { class: 'revisi', label: '<i class="fa-solid fa-triangle-exclamation"></i> Butuh Perbaikan', btnText: 'Perbaiki Data', btnIcon: 'fa-wrench' },
            3: { class: 'verifikasi-ulang', label: '<i class="fa-solid fa-rotate"></i> Verifikasi Ulang', btnText: 'Lihat Isian', btnIcon: 'fa-eye' },
            4: { class: 'selesai', label: '<i class="fa-solid fa-check-double"></i> Selesai (Disetujui)', btnText: 'Lihat Isian Akhir', btnIcon: 'fa-lock' }
        };

        // 4. Looping 12 Variabel
        for (let i = 1; i <= 12; i++) {
            // Tarik data judul dari dbVariabel
            const dataVar = dbVariabel.find(v => v.id === i) || { id: i, judul: `Variabel ${i}` };

            // Tarik status dari database lokal
            const vState = opdData.variabelStatus[`v${i}`] || { status: 0 };
            const currentStatus = statusConfig[vState.status] || statusConfig[0];

            // Tambahkan efek glow merah khusus jika status = 2 (Revisi)
            let extraStyle = vState.status === 2 ? 'box-shadow: 0 0 15px rgba(153, 27, 27, 0.2);' : '';
            
            // Variabel 12 Khusus Google Drive
            const isDriveCard = i === 12;
            const cardBorder = isDriveCard ? 'border: 2px solid #3b82f6;' : '';

            // Render Card HTML
            const cardHTML = `
                <div class="var-card status-${vState.status}" style="${extraStyle} ${cardBorder}">
                    <div>
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                            <span class="badge ${currentStatus.class}">${currentStatus.label}</span>
                            ${isDriveCard ? '<span style="background:#eff6ff; color:#2563eb; font-size:0.75rem; font-weight:bold; padding:2px 8px; border-radius:4px;"><i class="fa-brands fa-google-drive"></i> Bukti Fisik</span>' : ''}
                        </div>
                        <h3 class="var-title" style="${isDriveCard ? 'color:#1e3a8a;' : ''}">${dataVar.judul}</h3>
                        
                        ${vState.status === 2 ? `<p style="font-size: 0.8rem; color: var(--status-revisi); margin-top: -10px; margin-bottom: 15px; font-weight: 600;">" ${vState.catatanAdmin} "</p>` : ''}
                        ${isDriveCard && vState.driveLink ? `<p style="font-size:0.8rem; color:#2563eb; margin-top:-5px; margin-bottom:12px; word-break:break-all;"><i class="fa-solid fa-link"></i> ${vState.driveLink}</p>` : ''}
                    </div>
                    <a href="detail.html?v=${i}" class="btn-kerja" style="${isDriveCard ? 'background:#2563eb;' : ''}">
                        <i class="fa-solid ${isDriveCard && vState.status === 0 ? 'fa-cloud-arrow-up' : currentStatus.btnIcon}"></i> ${isDriveCard && vState.status === 0 ? 'Input Tautan Drive' : currentStatus.btnText}
                    </a>
                </div>
            `;
            container.innerHTML += cardHTML;
        }
    </script>
</body>

</html>
